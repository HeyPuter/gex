[package]
name = "gex-embed"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "gex hosted in another program's wasm module: the translator in an emscripten host's memory and Workers"

[lib]
# staticlib: what an emscripten link (android-wasm's dotnet.native.wasm) takes. rlib: the native tests.
crate-type = ["staticlib", "rlib"]

[dependencies]
gex-abi.workspace = true
gex-xlate.workspace = true
gex-emit.workspace = true
