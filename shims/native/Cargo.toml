[package]
name = "gex-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native host for gex: wasmtime engine plus the kernel bindings"

[dependencies]
gex-abi.workspace = true
gex-cache.workspace = true
gex-key.workspace = true
gex-emit.workspace = true
gex-mem.workspace = true
gex-kernel.workspace = true
gex-wayland.workspace = true
gex-gpu.workspace = true
gex-gl = { workspace = true, features = ["host"] }
gex-ld.workspace = true
gex-xlate = { workspace = true, features = ["parallel", "cgen"] }
gex-cgen.workspace = true

anyhow = "1"
# `parallel-compilation` is not a default here because `default-features` is
# off, and leaving it off made every compile serial. gex hands wasmtime a
# module with one function per guest basic block -- fifty thousand of them for
# bash, half a million for Mesa -- which is close to the ideal shape for
# compiling in parallel, and it was using one core out of twenty-four.
wasmtime = { version = "27", default-features = false, features = ["cranelift", "runtime", "std", "threads", "parallel-compilation"] }

[features]
# Host an x86-64 guest. See `gex_abi::X86`.
x86 = ["gex-abi/x86", "gex-xlate/x86", "gex-kernel/x86"]
# Host a 32-bit big-endian PowerPC guest (docs/ppc.md).
ppc = ["gex-abi/ppc", "gex-xlate/ppc", "gex-kernel/ppc"]

[dev-dependencies]
gex-ir.workspace = true
gex-emit.workspace = true
