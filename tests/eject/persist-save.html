<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>persist-save</title>
<!-- tests/eject/persist-save.sh: /save kept in IndexedDB, one store per
     ?how=; ?visit=N and ?how= are the probe's arguments. The probe does not
     exit: the driver reloads the page under it. -->
<style>html, body { margin: 0; background: #0b0b0d; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }</style>
</head>
<body>
<div id="status">loading</div>
<div id="stage"></div>
<script type="module">
import { start } from './app.mjs';
const st = document.getElementById('status');
const chunks = [];
let app = null;
globalThis.__test = { out: () => chunks.join(''), status: () => st.textContent, state: () => app?.state };
try {
  const q = new URLSearchParams(location.search);
  const visit = q.get('visit') ?? '0', how = q.get('how') ?? 'rename';
  const size = { w: 320, h: 200 };
  app = await start({
    container: document.getElementById('stage'),
    size,
    baseUrl: new URL('./', location.href),
    onLog: (t) => { chunks.push(t); },
    build: {
      tar: ['/bundle.tar'], exe: '/game/save-probe', argv: [visit, how],
      env: ['HOME=/save'], cwd: '/game', size,
      mtimes: true, featuresOff: [], compositor: false, aot: null, jitFallback: true,
      gl: false, hostx: false, mem64: false, pack: null, zstd: './vendor/zstddec-stream.mjs',
      preload: null, lazy: './lazy.json', persist: { dir: '/save', db: `gex-test:persist-save:${how}` }, switches: {},
    },
  });
  st.textContent = 'running';
  const code = await app.exited;
  st.textContent = `exited (${code})`;
} catch (e) {
  st.textContent = 'failed: ' + (e?.message ?? e);
}
</script>
</body>
</html>
