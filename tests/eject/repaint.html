<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>repaint</title>
<!-- tests/eject/repaint.sh: the output under a status line. -->
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0d; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }
  #bar { position: fixed; top: 0; left: 0; right: 0; height: 21px; padding: 6px 12px; background: #16161a;
         border-bottom: 1px solid #26262c; z-index: 2; }
  #stage { position: absolute; top: 34px; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: flex-start; }
  #stage canvas { max-width: 100%; height: auto; }
</style>
</head>
<body>
<div id="bar"><span id="status">loading</span></div>
<div id="stage"></div>
<script type="module">
import { start } from './app.mjs';
const st = document.getElementById('status');
const chunks = [];
// The compositor's counters at each phase line the client prints, taken as
// the line arrives (`describe().frames`, `.uploads`).
const marks = {};
globalThis.__test = { out: () => chunks.join(''), status: () => st.textContent, marks: () => marks };
try {
  const size = { w: 1280, h: 720 };
  const app = await start({
    container: document.getElementById('stage'),
    size,
    baseUrl: new URL('./', location.href),
    onLog: (t) => {
      chunks.push(t);
      for (const m of t.matchAll(/^phase (\w+) (start|end)$/gm)) {
        globalThis.__gexCompositor?.describe({ pixels: false }).then((d) => { marks[`${m[1]} ${m[2]}`] = { frames: d.frames, uploads: d.uploads }; });
      }
    },
    build: {
      tar: ['/bundle.tar'], exe: '/game/repaint', argv: ['60'],
      env: ['XDG_RUNTIME_DIR=/tmp', 'HOME=/home/g'], cwd: '/game', size,
      mtimes: true, featuresOff: [], compositor: true, aot: null, jitFallback: true,
      gl: false, hostx: false, mem64: false, pack: null, zstd: './vendor/zstddec-stream.mjs',
      preload: null, lazy: null, persist: null, switches: {},
    },
  });
  st.textContent = 'running';
  st.textContent = `exited (${await app.exited})`;
} catch (e) {
  st.textContent = 'failed: ' + (e?.message ?? e);
}
</script>
</body>
</html>
