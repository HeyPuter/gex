<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>persist-written</title>
<!-- tests/eject/persist-written.sh: /save kept in IndexedDB; ?visit=N is the
     probe's argument. After the probe exits the page takes a snapshot. -->
<style>html, body { margin: 0; background: #0b0b0d; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }</style>
</head>
<body>
<div id="status">loading</div>
<div id="stage"></div>
<script type="module">
import { start } from './app.mjs';
const st = document.getElementById('status');
const chunks = [];
let app = null;
globalThis.__test = { out: () => chunks.join(''), status: () => st.textContent, state: () => app?.state };
try {
  const visit = new URLSearchParams(location.search).get('visit') ?? '0';
  const size = { w: 320, h: 200 };
  app = await start({
    container: document.getElementById('stage'),
    size,
    baseUrl: new URL('./', location.href),
    onLog: (t) => { chunks.push(t); },
    build: {
      tar: ['/bundle.tar'], exe: '/game/persist-probe', argv: [visit],
      env: ['HOME=/save'], cwd: '/game', size,
      mtimes: true, featuresOff: [], compositor: false, aot: null, jitFallback: true,
      gl: false, hostx: false, mem64: false, pack: null, zstd: './vendor/zstddec-stream.mjs',
      preload: null, lazy: './lazy.json', persist: { dir: '/save', db: 'gex-test:persist-written' }, switches: {},
    },
  });
  st.textContent = 'running';
  const code = await app.exited;
  const r = await globalThis.__ntPersist?.();
  st.textContent = `exited (${code}) synced ${JSON.stringify(r)}`;
} catch (e) {
  st.textContent = 'failed: ' + (e?.message ?? e);
}
</script>
</body>
</html>
