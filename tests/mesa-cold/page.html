<!doctype html>
<meta charset="utf-8">
<title>Mesa cold part</title>
<pre id="out">loading</pre>
<script type="module">
// tests/mesa-cold/run.mjs's page: replays a GL trace through one build of
// Mesa's replay module on WebGPU, then reads the last frame back (READ_PIXELS,
// which waits on a buffer map: a JSPI suspension) and hashes it.
//   ?mesa=URL of gex-wgpu-replay.js &trace=URL
//   &lazy=1        leave the cold part for a miss on this main thread too
//   &noprefetch=1  and do not prefetch it after the first frame
//   &settle=MS     wait this long before the read-back (a prefetch's time)
// Result in globalThis.__result.
const q = new URLSearchParams(location.search);
const out = document.getElementById('out');
const log = (s) => { out.textContent += '\n' + s; console.log(s); };
function textureCanvas() {
  const canvas = new OffscreenCanvas(16, 16);
  let config = null, texture = null;
  const context = {
    canvas,
    configure(c) { config = c; },
    unconfigure() { config = null; },
    getConfiguration() { return config; },
    getCurrentTexture() {
      if (!texture || texture.width !== canvas.width || texture.height !== canvas.height) {
        texture?.destroy();
        texture = config.device.createTexture({
          size: [canvas.width, canvas.height], format: config.format, viewFormats: config.viewFormats ?? [],
          usage: (config.usage ?? GPUTextureUsage.RENDER_ATTACHMENT) | GPUTextureUsage.TEXTURE_BINDING |
            GPUTextureUsage.COPY_DST | GPUTextureUsage.COPY_SRC,
        });
      }
      return texture;
    },
  };
  const own = canvas.getContext.bind(canvas);
  canvas.getContext = (t, o) => (t === 'webgpu' ? context : own(t, o));
  return canvas;
}
function hasPresent(b) {
  const v = new DataView(b.buffer, b.byteOffset, b.byteLength);
  for (let at = 0; at + 8 <= b.length;) {
    const op = v.getUint32(at, true), size = v.getUint32(at + 4, true);
    if (op === 4) return true;
    if (size < 8) break;
    at += size;
  }
  return false;
}
try {
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) throw new Error('no WebGPU adapter');
  const optional = ['texture-compression-bc', 'depth32float-stencil8', 'rg11b10ufloat-renderable',
    'depth-clip-control', 'float32-filterable', 'float32-blendable', 'clip-distances', 'dual-source-blending'];
  const device = await adapter.requestDevice({ requiredFeatures: optional.filter((f) => adapter.features.has(f)) });
  let validation = 0;
  device.addEventListener('uncapturederror', (e) => { if (validation++ < 5) console.error('WebGPU validation: ' + e.error?.message); });
  const glCanvas = textureCanvas();
  const qs = document.querySelector.bind(document);
  document.querySelector = (s) => (String(s).includes('gex-gl') ? glCanvas : qs(s));
  const mesa = new URL(q.get('mesa'), location.href).href;
  const { default: create } = await import(mesa);
  const m = await create({
    preinitializedWebGPUDevice: device, mainScriptUrlOrBlob: mesa,
    locateFile: (f) => new URL(f, mesa).href,
    gexColdLazy: q.get('lazy') === '1', gexNoColdPrefetch: q.get('noprefetch') === '1',
    print: (l) => console.log('[mesa] ' + l), printErr: (l) => console.warn('[mesa] ' + l),
  });
  const submit = WebAssembly.promising(m.gexGlSubmitRaw);
  const bytes = new Uint8Array(await (await fetch(q.get('trace'))).arrayBuffer());
  const dv = new DataView(bytes.buffer);
  const W = dv.getUint32(16, true), H = dv.getUint32(20, true);
  glCanvas.width = W; glCanvas.height = H;
  if (m._gex_gl_init(W, H) !== 0) throw new Error('init failed');
  let ptr = m._malloc(1 << 20), cap = 1 << 20, frames = 0, rejects = 0;
  for (let at = 24; at < bytes.length;) {
    const len = dv.getUint32(at, true);
    const b = bytes.subarray(at + 8, at + 8 + len);
    at += 8 + len + ((4 - (len & 3)) & 3);
    if (b.length > cap) { m._free(ptr); cap = b.length; ptr = m._malloc(cap); }
    m.HEAPU8.set(b, ptr);
    if ((await submit(ptr, b.length, 0)) !== 0) rejects++;
    if (hasPresent(b)) {
      m._gex_gl_display();
      if (++frames % 32 === 0) await device.queue.onSubmittedWorkDone();
    }
  }
  await device.queue.onSubmittedWorkDone();
  await new Promise((r) => setTimeout(r, Number(q.get('settle') || 0)));
  // READ_PIXELS of the default framebuffer, RGBA/UNSIGNED_BYTE.
  const cmd = new Uint8Array(44); const cv = new DataView(cmd.buffer);
  [128, cmd.length, 0, 0, W, H, 0x1908, 0x1401, 0, 0, 0].forEach((w, i) => cv.setUint32(i * 4, w, true));
  m.HEAPU8.set(cmd, ptr);
  if ((await submit(ptr, cmd.length, 0)) !== 0) rejects++;
  const rlen = m._gex_gl_reply_len(), rat = m._gex_gl_reply_data();
  const px = m.HEAPU8.slice(rat + 8, rat + rlen);
  let h = 0x811c9dc5;
  for (let i = 0; i < px.length; i++) { h ^= px[i]; h = Math.imul(h, 0x01000193) >>> 0; }
  globalThis.__result = { ok: rejects === 0 && validation === 0, digest: `${h.toString(16)}/${px.length}`, frames, rejects, validation };
} catch (e) {
  globalThis.__result = { ok: false, error: String(e?.stack || e) };
}
log(JSON.stringify(globalThis.__result));
</script>
