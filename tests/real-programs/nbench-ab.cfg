# An nbench configuration for telling two builds apart.
#
#   node shims/browser/js/run-node.mjs --dir "$D=$D" --cwd "$D" \
#       --argv0 "$D/nbench" module.wasm "$D/nbench" -ctests/real-programs/nbench-ab.cfg
#
# `BASELINE.md` records the harness noise as about 30% and concludes that
# only very large effects are readable. That is true of the configuration it
# used -- ten kernels at two seconds each -- and not of the harness. Three
# runs of this one, on a shared 24-core machine with a VM busy on it, spread
# 1.4% on NUMERIC SORT, 3.4% on STRING SORT, 2.7% on FOURIER and 7.7% on
# IDEA. That is enough to resolve a 15% change, which the two-second
# configuration is not.
#
# Two things make the difference. Five seconds a kernel rather than two, so
# the calibration has something to work with; and four kernels rather than
# ten, so three repeats of both sides of an A/B cost minutes instead of an
# hour. The four are chosen to be an experiment rather than a survey:
#
#   NUMERIC SORT, STRING SORT, IDEA   integer and comparison-heavy, which is
#                                     where a codegen change to the flags or
#                                     the dispatch should show up
#   FOURIER                           floating point, and the control: a
#                                     change that moves this as much as the
#                                     others has not done what it claims,
#                                     because it has moved everything
#
# A control matters more than another data point. An effect that appears in
# the three integer kernels and not in the FP one is an effect; an effect
# that appears in all four is the machine.
CUSTOMRUN=T
DONUMSORT=T
DOSTRINGSORT=T
DOIDEA=T
DOFOUR=T
DOBITFIELD=F
DOEMF=F
DOASSIGN=F
DOHUFF=F
DONNET=F
DOLU=F
NUMMINSECONDS=5
STRMINSECONDS=5
IDEAMINSECONDS=5
FOURMINSECONDS=5
ALLSTATS=F
