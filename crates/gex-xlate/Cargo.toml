[package]
name = "gex-xlate"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The gex translator: code discovery, lifting and codegen driver"

[dependencies]
gex-abi.workspace = true
gex-isa.workspace = true
gex-ir.workspace = true
gex-lift.workspace = true
gex-isa-x86 = { workspace = true, optional = true }
gex-lift-x86 = { workspace = true, optional = true }
gex-emit.workspace = true
gex-ld.workspace = true

[features]
# Lift blocks on every core. Off for the browser shim, which reaches this
# code compiled to wasm where `std::thread::scope` is not available.
default = []
parallel = ["gex-emit/parallel"]
# Translate an x86-64 guest instead of AArch64. See `gex_abi::X86`.
x86 = ["gex-abi/x86", "dep:gex-isa-x86", "dep:gex-lift-x86"]
