[package]
name = "gex-xlate"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The gex translator: code discovery, lifting and codegen driver"

[dependencies]
gex-abi.workspace = true
gex-isa.workspace = true
gex-ir.workspace = true
gex-lift.workspace = true
gex-isa-x86 = { workspace = true, optional = true }
gex-lift-x86 = { workspace = true, optional = true }
gex-emit.workspace = true
gex-ld.workspace = true
gex-cgen = { workspace = true, optional = true }
gex-fjit = { workspace = true, optional = true }

[features]
# Lift blocks on every core. Off for the browser shim, which reaches this
# code compiled to wasm where `std::thread::scope` is not available.
default = []
parallel = ["gex-emit/parallel"]
# Translate an x86-64 guest instead of AArch64. See `gex_abi::X86`.
x86 = ["gex-abi/x86", "dep:gex-isa-x86", "dep:gex-lift-x86"]
# The function tier (`Options::cgen`): C through clang, spliced into the
# tier-1 module. Needs clang and wasm-ld at translation time, so native only.
cgen = ["dep:gex-cgen"]
# The function JIT (`Options::fjit`): GIR straight to wasm, no toolchain.
fjit = ["dep:gex-fjit", "dep:gex-cgen"]

[dev-dependencies]
# The relayout test's layout oracle reads the fixture's DWARF.
gimli = { version = "0.33", default-features = false, features = ["read", "std"] }
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "std"] }
# The hosted test walks what it translated.
wasmparser = "0.219.2"
