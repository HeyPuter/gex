[package]
name = "gex-eject"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "gex-eject: turn a recorded gex session into a standalone, customizable project"

[dependencies]
gex-abi.workspace = true
gex-ld.workspace = true
gex-xlate = { workspace = true, features = ["parallel"] }
gex-emit.workspace = true
gex-cache.workspace = true
gex-native.workspace = true
gex-kernel.workspace = true
gex-cgen.workspace = true
gex-split.workspace = true
gex-ir.workspace = true
gex-key.workspace = true
anyhow = "1"
wasmparser = "0.219.2"

[features]
default = ["build"]
# Ejecting and building projects (translation, unit builds). Off: only
# running a built one, with a runtime that has no translator (gex-rt).
build = ["gex-native/translate", "gex-cache/compile"]
# For an x86-64 guest. See `gex_abi::X86`.
x86 = ["gex-abi/x86", "gex-xlate/x86", "gex-native/x86", "gex-kernel/x86"]
