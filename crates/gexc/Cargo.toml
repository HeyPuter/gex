[package]
name = "gexc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The gex command-line driver"

[[bin]]
name = "gexc"
path = "src/main.rs"

[dependencies]
gex-abi.workspace = true
gex-ir.workspace = true
gex-ld.workspace = true
gex-xlate = { workspace = true, features = ["parallel", "cgen"] }
gex-emit.workspace = true
gex-native.workspace = true
anyhow = "1"

[features]
# Build a gexc for x86-64 guests. See `gex_abi::X86`.
x86 = ["gex-abi/x86", "gex-xlate/x86", "gex-native/x86"]
