[package]
name = "gex-rt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The runtime of an ejected gex project: runs code built ahead of time only, with no translator or wasm compiler in it"

[dependencies]
gex-eject = { workspace = true, default-features = false }
gex-native.workspace = true
gex-cgen.workspace = true
anyhow = "1"

[features]
x86 = ["gex-eject/x86", "gex-native/x86"]
