[package]
name = "gex-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "gex-kernel: the userspace Linux personality"

[dependencies]
gex-abi.workspace = true
# Atomic operations on guest words (PI futexes); the one unsafe view.
gex-atomic.workspace = true
gex-f80.workspace = true
# PE parsing and mapping for the NT personality (docs/nt-layer.md §1.1).
gex-ld.workspace = true
# The GL wire protocol, for the NT layer's opengl32 (not the host renderer).
gex-gl.workspace = true

[features]
# Serve an x86-64 guest: its syscall numbers, struct layouts and signal frame.
x86 = ["gex-abi/x86"]
# Serve a 32-bit big-endian PowerPC guest (docs/ppc.md).
ppc = ["gex-abi/ppc"]
# The global kernel module serving processes with a 64-bit memory (the
# wasm64 browser shim, docs/mem64.md step 6): `PAddr` is u64.
process64 = []
# Check the lock order (`sync::rank`) in a release build, as a debug build
# always does: the page shim cannot be built with debug assertions whole
# (core's own checks reject its guest-memory slices), so its order check is
# this switch (shims/browser/build.sh: GEX_LOCK_RANKS=1).
lock-ranks = []
