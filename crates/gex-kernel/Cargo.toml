[package]
name = "gex-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "gex-kernel: the userspace Linux personality"

[dependencies]
gex-abi.workspace = true
gex-f80.workspace = true
# PE parsing and mapping for the NT personality (docs/nt-layer.md §1.1).
gex-ld.workspace = true
# The GL wire protocol, for the NT layer's opengl32 (not the host renderer).
gex-gl.workspace = true

[features]
# Serve an x86-64 guest: its syscall numbers, struct layouts and signal frame.
x86 = ["gex-abi/x86"]
# Serve a 32-bit big-endian PowerPC guest (docs/ppc.md).
ppc = ["gex-abi/ppc"]
