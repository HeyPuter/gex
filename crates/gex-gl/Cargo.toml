[package]
name = "gex-gl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenGL ES passthrough: a guest's GL calls, run on the host's GL"

[features]
# The native host renderer (`host`), which links the host's EGL and GLES.
# Off for users that only need the protocol, such as the NT layer's
# opengl32, so they gain no native link dependencies.
default = ["host"]
host = []

[dependencies]

# The native host's decoder for the generated commands is C++ shared with the
# browser's (native/gexgl-native.cpp), built here when `host` is on.
[build-dependencies]
cc = "1.4"

# The host half links against the host's own GL. There is nothing to build on
# a target that has none, and the guest half is C, so this is the only side
# that needs a library at all.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
