[package]
name = "gex-cache"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A content-addressed cache of compiled modules"

[dependencies]
anyhow = "1"
gex-key.workspace = true
wasmtime = { version = "49", default-features = false, features = ["runtime", "std", "threads", "gc", "gc-null", "anyhow"] }

[features]
default = ["compile"]
# A wasm compiler (Cranelift) in the process. Without it every module must
# have been compiled ahead of time (`compile` looks it up by content).
compile = ["wasmtime/cranelift"]
