[workspace]
resolver = "2"
members = [
    "crates/gex-abi",
    "crates/gex-cache",
    "crates/gex-mem",
    "crates/gex-isa",
    "crates/gex-isa-x86",
    "crates/gex-isa-ppc",
    "crates/gex-ir",
    "crates/gex-f80",
    "crates/gex-lift",
    "crates/gex-lift-x86",
    "crates/gex-lift-ppc",
    "crates/gex-emit",
    "crates/gex-kmem",
    "shims/kernel",
    "crates/gex-xlate",
    "crates/gex-ld",
    "crates/gex-kernel",
    "crates/gex-wayland",
    "crates/gex-xwm",
    "crates/gex-gpu",
    "crates/gex-gl",
    "crates/gex-virgl",
    "crates/gex-eject",
    "crates/gexc",
    "shims/browser",
    "shims/hostwl",
    "shims/native",
    "tests/diff-fuzz",
    "tests/diff-fuzz-x86",
    "tests/diff-fuzz-ppc",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/puter/gex"

[workspace.dependencies]
gex-abi = { path = "crates/gex-abi" }
gex-cache = { path = "crates/gex-cache" }
gex-mem = { path = "crates/gex-mem" }
gex-wayland = { path = "crates/gex-wayland" }
gex-xwm = { path = "crates/gex-xwm" }
gex-virgl = { path = "crates/gex-virgl" }
gex-gpu = { path = "crates/gex-gpu" }
gex-gl = { path = "crates/gex-gl", default-features = false }
gex-isa = { path = "crates/gex-isa" }
gex-isa-x86 = { path = "crates/gex-isa-x86" }
gex-isa-ppc = { path = "crates/gex-isa-ppc" }
gex-ir = { path = "crates/gex-ir" }
gex-f80 = { path = "crates/gex-f80" }
gex-lift = { path = "crates/gex-lift" }
gex-lift-x86 = { path = "crates/gex-lift-x86" }
gex-lift-ppc = { path = "crates/gex-lift-ppc" }
gex-emit = { path = "crates/gex-emit" }
gex-kmem = { path = "crates/gex-kmem" }
gex-xlate = { path = "crates/gex-xlate" }
gex-ld = { path = "crates/gex-ld" }
gex-kernel = { path = "crates/gex-kernel" }
gex-native = { path = "shims/native" }
gex-eject = { path = "crates/gex-eject" }

[profile.release]
opt-level = 3
debug = 1
