[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
strip = 'emstrip'
pkg-config = 'false'

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[properties]
needs_exe_wrapper = true

# SIMD and ThinLTO, and binaryen at -O3 when linking (emcc runs it for a
# linking -O3): pewasm's Mesa overlay (tools/optimization_config.py --opt 3
# --simd --thin-lto). A replayed Noita frame costs 7% less CPU in
# gex_gl_submit (5.09 and 4.99 ms against 5.45 and 5.47; docs/gl-path.md).
[built-in options]
c_args = ['-D_GNU_SOURCE', '-D_POSIX_C_SOURCE=200809L', '-pthread', '-msimd128', '-flto=thin']
cpp_args = ['-D_GNU_SOURCE', '-D_POSIX_C_SOURCE=200809L', '-pthread', '-msimd128', '-flto=thin']
c_link_args = ['-msimd128', '-flto=thin', '-O3']
cpp_link_args = ['-msimd128', '-flto=thin', '-O3']
