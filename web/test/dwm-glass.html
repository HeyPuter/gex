<!doctype html>
<meta charset="utf-8">
<title>DWM glass test</title>
<style>body { font: 13px monospace; background: #fff; } canvas { border: 1px solid #888; margin: 4px; }</style>
<pre id="out">running</pre>
<script type="module">
// dwm-glass.js's GPU passes against a CPU reference of Windows 7 DWM's glass
// written from its description (D3D sampling: clamp addressing, texel centres
// at n + 0.5, bilinear; UNORM targets rounding to the nearest step), on a
// noisy backdrop whose width is not a multiple of 4, glass at the edges.
// `window.result` holds { pass, cases: [{ name, maxDiff, over1 }] }.
import { DwmGlass, dwmBlurTaps, dwmGlassConstants } from '../src/dwm-glass.js';

const out = document.getElementById('out');
const log = (s) => { out.textContent += '\n' + s; };

function backdrop(W, H, seed) {
  const px = new Uint8Array(W * H * 4);
  let s = seed;
  const rnd = () => ((s = (s * 1103515245 + 12345) >>> 0) >>> 16) & 0xff;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const o = (y * W + x) * 4;
      const stripe = ((x >> 3) ^ (y >> 3)) & 1;
      px[o] = stripe ? rnd() : (x * 255 / W) | 0;
      px[o + 1] = (y * 7 + x * 3) & 0xff;
      px[o + 2] = rnd();
      px[o + 3] = 255;
    }
  }
  return px;
}

const unorm = (v) => Math.round(Math.min(1, Math.max(0, v)) * 255);

function reference(px, W, H, rects, c) {
  const { positions, weights } = dwmBlurTaps();
  const Wa = Math.max(1, W >> 2);
  // bilinear at (x, y) in texel space of an image w x h of floats (rgb, 0..1)
  const bil = (img, w, h, x, y) => {
    x = Math.min(Math.max(x, 0.5), w - 0.5) - 0.5;
    y = Math.min(Math.max(y, 0.5), h - 0.5) - 0.5;
    const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j;
    const at = (a, b) => {
      a = Math.min(Math.max(a, 0), w - 1); b = Math.min(Math.max(b, 0), h - 1);
      return (b * w + a) * 3;
    };
    const r = [0, 0, 0];
    for (let k = 0; k < 3; k++) {
      const p = img[at(i, j) + k], q = img[at(i + 1, j) + k];
      const s = img[at(i, j + 1) + k], t = img[at(i + 1, j + 1) + k];
      r[k] = (p * (1 - fx) + q * fx) * (1 - fy) + (s * (1 - fx) + t * fx) * fy;
    }
    return r;
  };
  const src = new Float32Array(W * H * 3);
  for (let i = 0; i < W * H; i++) for (let k = 0; k < 3; k++) src[i * 3 + k] = px[i * 4 + k] / 255;
  // pass 1: horizontally into Wa x H, centred on column 4 bx + 2 then each
  // tap's offset (position - 0.5) source texels (scaled as dwmcore's 1/(4 Wa))
  const acc = new Float32Array(Wa * H * 3);
  for (let y = 0; y < H; y++) {
    for (let bx = 0; bx < Wa; bx++) {
      const s = [0, 0, 0];
      for (let k = 0; k < 8; k++) {
        const x = 4 * (bx + 0.5) + (positions[k] - 0.5) * W / (4 * Wa);
        const v = bil(src, W, H, x, y + 0.5);
        for (let ch = 0; ch < 3; ch++) s[ch] += v[ch] * weights[k];
      }
      for (let ch = 0; ch < 3; ch++) acc[(y * Wa + bx) * 3 + ch] = unorm(s[ch]) / 255;
    }
  }
  // pass 2: vertically from the buffer stretched to W, then the colorization
  const res = new Uint8Array(px);
  for (const r of rects) {
    for (let y = r.y; y < r.y + r.h; y++) {
      for (let x = r.x; x < r.x + r.w; x++) {
        const s = [0, 0, 0];
        for (let k = 0; k < 8; k++) {
          const v = bil(acc, Wa, H, (x + 0.5) * Wa / W, y + 0.5 + positions[k]);
          for (let ch = 0; ch < 3; ch++) s[ch] += v[ch] * weights[k];
        }
        const luma = 0.2126 * s[0] + 0.7152 * s[1] + 0.0722 * s[2];
        const o = (y * W + x) * 4;
        for (let ch = 0; ch < 3; ch++) res[o + ch] = unorm(s[ch] * c.blur + luma * c.afterglow[ch] + c.colour[ch]);
        res[o + 3] = 255;
      }
    }
  }
  return res;
}

async function gpu(device, dwm, px, W, H, rects, c) {
  const scene = device.createTexture({
    size: [W, H], format: 'rgba8unorm',
    usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC | GPUTextureUsage.COPY_DST | GPUTextureUsage.TEXTURE_BINDING,
  });
  device.queue.writeTexture({ texture: scene }, px, { bytesPerRow: W * 4 }, [W, H]);
  const bpr = Math.ceil(W * 4 / 256) * 256;
  const read = device.createBuffer({ size: bpr * H, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  const enc = device.createCommandEncoder();
  dwm.frame();
  dwm.encode(enc, scene, W, H, rects, c);
  enc.copyTextureToBuffer({ texture: scene }, { buffer: read, bytesPerRow: bpr }, [W, H]);
  device.queue.submit([enc.finish()]);
  await read.mapAsync(GPUMapMode.READ);
  const m = new Uint8Array(read.getMappedRange());
  const res = new Uint8Array(W * H * 4);
  for (let y = 0; y < H; y++) res.set(m.subarray(y * bpr, y * bpr + W * 4), y * W * 4);
  read.unmap();
  scene.destroy();
  return res;
}

function show(px, W, H) {
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  cv.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(px), W, H), 0, 0);
  document.body.append(cv);
}

const adapter = await navigator.gpu.requestAdapter();
const device = await adapter.requestDevice();
const dwm = new DwmGlass(device, 'rgba8unorm');
// Windows 7's default "Sky": colour and afterglow 0x6b74b8fc, balances 8, 43, 49
const sky = { argb: 0x6b74b8fc, afterglow: 0x6b74b8fc, balance: 8, afterglowBalance: 43, blurBalance: 49 };
const cases = [
  { name: 'active, 803x157', W: 803, H: 157, f: 1,
    rects: [{ x: 0, y: 0, w: 803, h: 30 }, { x: 0, y: 30, w: 8, h: 100 }, { x: 795, y: 30, w: 8, h: 100 }, { x: 0, y: 130, w: 803, h: 27 }] },
  { name: 'inactive, 640x120, inset', W: 640, H: 120, f: 0.4,
    rects: [{ x: 101, y: 17, w: 333, h: 29 }, { x: 101, y: 46, w: 7, h: 50 }] },
  { name: 'active, 1366x40 (taskbar-like)', W: 1366, H: 40, f: 1, rects: [{ x: 0, y: 0, w: 1366, h: 40 }] },
];
const result = { pass: true, cases: [] };
for (const t of cases) {
  const px = backdrop(t.W, t.H, t.W * 31 + t.H);
  const c = dwmGlassConstants(sky, t.f);
  const want = reference(px, t.W, t.H, t.rects, c);
  const got = await gpu(device, dwm, px, t.W, t.H, t.rects, c);
  let maxDiff = 0, over1 = 0;
  for (let i = 0; i < want.length; i++) {
    const d = Math.abs(want[i] - got[i]);
    maxDiff = Math.max(maxDiff, d);
    if (d > 1) over1++;
  }
  const ok = maxDiff <= 1;
  result.pass &&= ok;
  result.cases.push({ name: t.name, maxDiff, over1, constants: c });
  log(`${ok ? 'ok  ' : 'FAIL'} ${t.name}: max channel difference ${maxDiff}, ${over1} channels off by more than 1`);
  show(got, t.W, t.H);
}
log(result.pass ? 'PASS' : 'FAIL');
window.result = result;
</script>
