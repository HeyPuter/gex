<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@TITLE@</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0d; color: #ddd; font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 34rem; margin: 18vh auto 0; padding: 0 16px; }
  h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 1rem; }
  #stage { margin: .6rem 0 0; color: #aaa; min-height: 1.4em; }
  #err { color: #f88; white-space: pre-wrap; }
  button { margin-top: 1rem; font: inherit; padding: .4rem 1rem; background: #c8a24a; color: #111; border: 0; border-radius: 4px; cursor: pointer; }
  small { color: #777; }
</style>
</head>
<body>
<main>
  <h1>@TITLE@</h1>
  <p id="stage">Starting…</p>
  <p id="err"></p>
  <small>Runs entirely in your browser (WebAssembly and WebGPU). Saves stay in this browser.</small>
</main>
<script type="module">
  // Generated by web/eject-site.mjs: the launcher of an ejected Windows
  // program's static site. It checks the browser (cross-origin isolation,
  // which the host's headers give, and WebGPU), then opens the program's
  // page (nt.html) on the build, which fetches and decodes the packed files
  // (pack.json) itself. No service worker; caching is the HTTP cache.
  //   ?persist=0   start from the build's files (no saves restored or kept)
  //   ?env=K=V,... more environment for the runtime (GEX_NT_STATS=1, ...)
  //   ?size=WxH    the window's size (default: fits this window)
  const q = new URLSearchParams(location.search);
  const stage = document.getElementById('stage');
  const err = document.getElementById('err');
  const fail = (m) => { err.textContent = m; stage.textContent = ''; };
  try {
    // An older build of this site installed a service worker: it goes.
    for (const r of (await navigator.serviceWorker?.getRegistrations?.()) ?? []) await r.unregister();
    if (!crossOriginIsolated) throw new Error('This page needs cross-origin isolation for its threads: serve it with the headers Cross-Origin-Opener-Policy: same-origin and Cross-Origin-Embedder-Policy: require-corp (serve.mjs and _headers here do).');
    if (!navigator.gpu) throw new Error('This browser has no WebGPU. Use a recent desktop Chrome or Edge with hardware acceleration on.');
    const site = await (await fetch('pack.json', { cache: 'no-cache' })).json().catch(() => ({}));
    const m0 = await (await fetch('project/build/web/nt.json', { cache: 'no-cache' })).json();
    // A W3 page (Wine as wasm32, docs/eject.md "W3 pages"): started as it
    // was recorded, its units in front of the translator.
    if (m0.kind === 'w3') {
      const m = m0;
      const p = new URLSearchParams({
        tar: '/project/build/web/rootfs.tar',
        exe: m.exe,
        argv: JSON.stringify(m.argv ?? []),
        env: (m.env ?? []).join(','),
        cwd: m.cwd ?? '/',
        size: q.get('size') ?? m.size,
        cgen: '1',
        cgenurl: '/project/build/web/units',
        preload: '/project/build/web/units/preload.json',
        pack: `/pack.json?v=${site.build ?? ''}`,
        ...(m.mtimes ? { mtimes: '1' } : {}),
        ...(m.params ?? {}),
      });
      for (const k of ['trapstack', 'present', 'fjit', 'compositor', 'strace']) if (q.has(k)) p.set(k, q.get(k));
      location.replace(`nt.html?${p}`);
      await new Promise(() => {});
    }
    const m = m0;
    const env = [`GEX_WINE_PREFIX=${m.prefix}`, ...m.settings, ...m.env, ...(q.get('env') ? [q.get('env')] : [])];
    const fit = `${Math.max(640, innerWidth) & ~7}x${Math.max(480, innerHeight) & ~7}`;
    const p = new URLSearchParams({
      tar: '/project/build/web/rootfs.tar',
      exe: m.exe,
      env: env.join(','),
      cgen: '2',
      cgenurl: `/project/${m.cgen}`,
      size: q.get('size') ?? m.size ?? fit,
      aot: '1',
      // Compile the units while the bundle unpacks (eject-site's list).
      preload: `/project/${m.cgen}/preload.json`,
      // The packed files (FILE.zst), which nt.html fetches and decodes.
      pack: `/pack.json?v=${site.build ?? ''}`,
    });
    if (m.cwd && m.cwd !== '/') p.set('cwd', m.cwd);
    if (m.unguarded) p.set('unguarded', '1');
    if (m.persist && q.get('persist') !== '0') {
      p.set('persist', m.persist);
      p.set('persistdb', `gex-eject:${m.exe}`);
    }
    if (m.args?.length) p.set('argv', JSON.stringify(m.args));
    if (m.gl) { p.set('gl', '1'); p.set('glbackend', 'wgpu'); }
    // Direct present (eject-site's default for a GL program): its single GL
    // window is the canvas, the compositor only when another window shows.
    // `?direct=0` composites always.
    if (m.direct && q.get('direct') !== '0') p.set('direct', '1');
    // Diagnostics for the page itself, passed through.
    for (const k of ['present', 'pointerlock', 'wgslcache', 'mesaenv', 'trapstack', 'sharetrace', 'glcapture', 'wgpustats']) if (q.has(k)) p.set(k, q.get(k));
    location.replace(`nt.html?${p}`);
  } catch (e) {
    fail(String(e?.message ?? e));
  }
</script>
</body>
</html>
