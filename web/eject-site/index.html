<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@TITLE@</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0d; color: #ddd; font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 34rem; margin: 18vh auto 0; padding: 0 16px; }
  h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 1rem; }
  .bar { height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: #c8a24a; transition: width .1s linear; }
  #stage { margin: .6rem 0 0; color: #aaa; min-height: 1.4em; }
  #err { color: #f88; white-space: pre-wrap; }
  button { margin-top: 1rem; font: inherit; padding: .4rem 1rem; background: #c8a24a; color: #111; border: 0; border-radius: 4px; cursor: pointer; }
  small { color: #777; }
</style>
</head>
<body>
<main>
  <h1>@TITLE@</h1>
  <div class="bar"><div id="fill"></div></div>
  <p id="stage">Starting…</p>
  <p id="err"></p>
  <small>Runs entirely in your browser (WebAssembly and WebGPU). Saves stay in this browser.</small>
</main>
<script type="module">
  // Generated by web/eject-site.mjs: the launcher of an ejected Windows
  // program's static site. It installs sw.js (cross-origin isolation, and the
  // .zst files decoded and cached), downloads every packed file with a
  // progress bar, then opens the program's page (nt.html) on the build.
  //   ?persist=0   start from the build's files (no saves restored or kept)
  //   ?env=K=V,... more environment for the runtime (GEX_NT_STATS=1, ...)
  //   ?size=WxH    the window's size (default: fits this window)
  const q = new URLSearchParams(location.search);
  const fill = document.getElementById('fill');
  const stage = document.getElementById('stage');
  const err = document.getElementById('err');
  const fail = (m) => { err.textContent = m; stage.textContent = ''; };
  const mb = (n) => (n / 1048576).toFixed(0);
  try {
    if (!('serviceWorker' in navigator)) throw new Error('This page needs service workers (HTTPS or localhost).');
    if (!navigator.gpu) throw new Error('This browser has no WebGPU. Use a recent desktop Chrome or Edge with hardware acceleration on.');
    const reg = await navigator.serviceWorker.register('sw.js', { type: 'module' });
    await navigator.serviceWorker.ready;
    if (!navigator.serviceWorker.controller || !crossOriginIsolated) {
      // First visit: the worker controls the next load (once only, so a
      // server or browser that refuses isolation does not loop).
      if (!sessionStorage.getItem('gex-reloaded')) {
        sessionStorage.setItem('gex-reloaded', '1');
        location.reload();
        await new Promise(() => {});
      }
      if (!crossOriginIsolated) throw new Error('The page could not be cross-origin isolated (needed for threads). Serve it over HTTPS or from localhost.');
    }
    sessionStorage.removeItem('gex-reloaded');
    stage.textContent = 'Downloading…';
    const ch = new MessageChannel();
    await new Promise((resolve, reject) => {
      ch.port1.onmessage = (e) => {
        const m = e.data;
        if (m.error) return reject(new Error(m.error));
        fill.style.width = `${(100 * m.got / Math.max(1, m.total)).toFixed(1)}%`;
        stage.textContent = m.done ? 'Starting…' : `Downloading… ${mb(m.got)} of ${mb(m.total)} MB`;
        if (m.done) resolve();
      };
      (reg.active ?? navigator.serviceWorker.controller).postMessage({ prefetch: true }, [ch.port2]);
    });
    const m = await (await fetch('project/build/web/nt.json', { cache: 'no-cache' })).json();
    const env = [`GEX_WINE_PREFIX=${m.prefix}`, ...m.settings, ...m.env, ...(q.get('env') ? [q.get('env')] : [])];
    const fit = `${Math.max(640, innerWidth) & ~7}x${Math.max(480, innerHeight) & ~7}`;
    const p = new URLSearchParams({
      tar: '/project/build/web/rootfs.tar',
      exe: m.exe,
      env: env.join(','),
      cgen: '2',
      cgenurl: `/project/${m.cgen}`,
      size: q.get('size') ?? m.size ?? fit,
      aot: '1',
      // Compile the units while the bundle unpacks (eject-site's list).
      preload: `/project/${m.cgen}/preload.json`,
    });
    if (m.cwd && m.cwd !== '/') p.set('cwd', m.cwd);
    if (m.unguarded) p.set('unguarded', '1');
    if (m.persist && q.get('persist') !== '0') {
      p.set('persist', m.persist);
      p.set('persistdb', `gex-eject:${m.exe}`);
    }
    if (m.args?.length) p.set('argv', JSON.stringify(m.args));
    if (m.gl) { p.set('gl', '1'); p.set('glbackend', 'wgpu'); }
    // Diagnostics for the page itself, passed through.
    for (const k of ['present', 'wgslcache', 'mesaenv', 'trapstack', 'sharetrace']) if (q.has(k)) p.set(k, q.get(k));
    location.replace(`nt.html?${p}`);
  } catch (e) {
    fail(String(e?.message ?? e));
  }
</script>
</body>
</html>
